<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="brand-illustration">
  <defs>
    <linearGradient id="machineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Machine Base -->
  <rect x="60" y="180" width="280" height="80" rx="5" fill="url(#machineGradient)" opacity="0.8"/>
  
  <!-- Machine Body -->
  <rect x="80" y="80" width="240" height="110" rx="8" fill="url(#machineGradient)" opacity="0.9"/>
  
  <!-- Control Panel -->
  <rect x="100" y="100" width="80" height="70" rx="4" fill="#f59e0b" opacity="0.7"/>
  
  <!-- Buttons -->
  <circle cx="115" cy="115" r="5" fill="#666" opacity="0.8"/>
  <circle cx="135" cy="115" r="5" fill="#666" opacity="0.8"/>
  <circle cx="155" cy="115" r="5" fill="#666" opacity="0.8"/>
  <circle cx="115" cy="140" r="5" fill="#666" opacity="0.8"/>
  <circle cx="135" cy="140" r="5" fill="#666" opacity="0.8"/>
  <circle cx="155" cy="140" r="5" fill="#666" opacity="0.8"/>
  
  <!-- Display Screen -->
  <rect x="200" y="100" width="100" height="60" rx="4" fill="#111" opacity="0.9"/>
  <text x="250" y="130" font-size="20" fill="#f59e0b" text-anchor="middle" font-weight="bold">●●●</text>
  
  <!-- Arm/Nozzle -->
  <rect x="280" y="60" width="25" height="80" rx="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="292" cy="55" r="10" fill="#f59e0b" opacity="0.9"/>
  
  <!-- Working Area -->
  <rect x="120" y="190" width="160" height="50" rx="3" fill="#667eea" opacity="0.5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Status Light -->
  <circle cx="85" cy="65" r="6" fill="#22c55e" opacity="0.9"/>
  <circle cx="85" cy="65" r="8" fill="#22c55e" opacity="0.4"/>
</svg>
