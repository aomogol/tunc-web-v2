<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="brand-illustration">
  <defs>
    <linearGradient id="testGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Board -->
  <rect x="50" y="80" width="300" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  
  <!-- Quality Check Grid -->
  <g stroke="#667eea" stroke-width="1" opacity="0.6">
    <line x1="100" y1="80" x2="100" y2="260"/>
    <line x1="150" y1="80" x2="150" y2="260"/>
    <line x1="200" y1="80" x2="200" y2="260"/>
    <line x1="250" y1="80" x2="250" y2="260"/>
    <line x1="300" y1="80" x2="300" y2="260"/>
    
    <line x1="50" y1="130" x2="350" y2="130"/>
    <line x1="50" y1="180" x2="350" y2="180"/>
    <line x1="50" y1="230" x2="350" y2="230"/>
  </g>
  
  <!-- Good Component -->
  <rect x="75" y="105" width="40" height="40" rx="3" fill="#667eea" opacity="0.8"/>
  <g transform="translate(95, 125)">
    <path d="M -8 -2 L 0 8 L 8 -4" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Good Component 2 -->
  <rect x="175" y="155" width="40" height="40" rx="3" fill="#667eea" opacity="0.8"/>
  <g transform="translate(195, 175)">
    <path d="M -8 -2 L 0 8 L 8 -4" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Good Component 3 -->
  <rect x="275" y="205" width="40" height="40" rx="3" fill="#667eea" opacity="0.8"/>
  <g transform="translate(295, 225)">
    <path d="M -8 -2 L 0 8 L 8 -4" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Inspection Icon -->
  <circle cx="320" cy="60" r="25" fill="url(#testGradient)" opacity="0.9"/>
  <g transform="translate(320, 60)">
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#fff" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Pass Label -->
  <text x="200" y="295" font-size="16" fill="#22c55e" font-weight="bold" text-anchor="middle" opacity="0.9">✓ PASS</text>
</svg>
